
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEFORE WE BECAME US</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eeeae2;
      color: #37372f;
      font-family: Georgia, serif;
    }

    .intro {
      width: 100%;
      max-width: 380px;
      min-height: 540px;
      padding: 48px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid #d5d0c5;
      background: #f8f6f0;
      box-shadow: 0 18px 50px #5c56451a;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #858575;
    }

    h1 {
      margin: 35px 0 18px;
      font-size: clamp(29px, 8vw, 39px);
      line-height: 1.2;
      font-weight: normal;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.9;
      color: #77766c;
    }

    .divider {
      width: 38px;
      height: 1px;
      margin: 30px 0;
      background: #b8b5a5;
    }

    .open-button {
      margin-top: 14px;
      padding: 14px 28px;
      border: 1px solid #777b68;
      background: #777b68;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .open-button:hover {
      background: #5f6453;
    }

    .footer {
      margin-top: 42px;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: #a19d90;
    }
    
/* GASKA'S PHONE */
#phone-screen {
  width: 100%;
  max-width: 380px;
  min-height: 680px;
  margin: 0 auto;
  padding: 30px 24px;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  position: relative;
  overflow: hidden;
  border: 7px solid #35372f;
  border-radius: 38px;
  background:
    radial-gradient(
      circle at 80% 20%,
      #e1dfc9 0,
      transparent 38%
    ),
    linear-gradient(
      160deg,
      #f5f1e7,
      #e5e3d5 60%,
      #d8d9c7
    );
  box-shadow: 0 20px 55px #38382b30;
  color: #37392f;
  font-family: Arial, sans-serif;
}

.phone-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.5px;
  color: #55584a;
}

#phone-screen h2 {
  margin: 48px 0 6px;
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
  letter-spacing: -1px;
}

#phone-screen h2::after {
  content: "his little corner of the world";
  display: block;
  margin-top: 10px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  color: #858675;
}

.apps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px 12px;
  margin-top: 42px;
}

.apps button {
  min-height: 92px;
  padding: 12px 4px;
  border: 1px solid #ffffffa0;
  border-radius: 20px;
  background: #ffffff70;
  box-shadow: 0 5px 14px #52523b10;
  color: #555847;
  font-size: 11px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}

.apps button:hover {
  background: #ffffffc9;
  transform: translateY(-3px);
}

.apps button:active {
  transform: scale(0.96);
}
  </style>
</head>

<body>
  <main class="intro">
    <p class="eyebrow">a story about two people</p>

    <h1>BEFORE<br>WE BECAME US</h1>

    <p class="subtitle">
      somewhere between a message<br>
      and a memory, we became something.
    </p>

    <div class="divider"></div>

    <button class="open-button" onclick="openPhone()">
      OPEN PHONE
    </button>

    <p class="footer">A STORY TOLD THROUGH HIS PHONE</p>
  </main>

  <script>
    function openPhone() {
  document.querySelector(".intro").style.display = "none";
  document.getElementById("phone-screen").style.display = "flex";
    }
  </script>
  <div id="phone-screen" style="display: none;">
  <div class="phone-status">
    <span>09:41</span>
    <span>Tue, 27 May</span>
  </div>

  <h2>Gaska's Phone</h2>

  <div class="apps">
    <button onclick="alert('Messages coming soon!')">
      💬 Messages
    </button>

    <button onclick="alert('Notes coming soon!')">
      📝 Notes
    </button>

    <button onclick="alert('Gallery coming soon!')">
      🖼️ Gallery
    </button>

    <button onclick="alert('Calendar coming soon!')">
      📅 Calendar
    </button>

    <button onclick="alert('Phone coming soon!')">
      📞 Phone
    </button>
  </div>
</div>
</body>
  </html>
